name: Build CART3R APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extrair projeto
        run: unzip CART3R-ModMenu-Android.zip -d source

      - name: Compilar APK
        run: gradle -p source/CART3R-ModMenu assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-APK
          path: source/CART3R-ModMenu/app/build/outputs/apk/debug/*.apk
